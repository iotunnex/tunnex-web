# Cloudflare Worker config for the tunnex.io marketing site.
# Secrets are NEVER stored here — use `wrangler secret put` (prod) and
# `.dev.vars` (local, gitignored; see .dev.vars.example).

name = "tunnex-site"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain routes are attached on Cloudflare Dashboard.
# routes = [
#   { pattern = "tunnex.io", custom_domain = true },
#   { pattern = "www.tunnex.io", custom_domain = true }
# ]
# Custom entry: the adapter's fetch handler + the lifecycle cron's scheduled
# handler (the adapter uses this instead of its default entry).
main = "src/worker.ts"

# Daily lifecycle run (03:17 UTC — off the top-of-hour stampede).
[triggers]
crons = ["17 3 * * *"]

# The build generates the deployable config (dist/client/wrangler.json) plus a
# .wrangler/deploy/config.json redirect — `wrangler dev`/`deploy` after
# `astro build` picks it up automatically. This file is the source config.
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "404-page"
# The assets layer must not swallow navigations to SSR routes: any route with
# prerender=false MUST be listed here, or browsers get the 404 page while curl
# gets the real response (Sec-Fetch-Mode: navigate triggers not_found_handling
# instead of invoking the Worker).
run_worker_first = [
  "/api/*",
  "/enterprise",
  "/enterprise/",
  "/subscribe/confirm",
  "/trial/verify",
  "/trial/verify/",
]

[vars]
# "prelaunch" | "beta" — see README. Flipping this is the only change
# needed to switch site modes.
LAUNCH_MODE = "prelaunch"
# Turnstile widget sitekey (public). The always-pass TEST key is local-dev
# only (.dev.vars) — never a deployed default.
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADz8NeQ_TUjJuy-O"
# Where enterprise-lead notifications land (Spacemail alias, staffed via support@).
SALES_NOTIFY_EMAIL = "sales@tunnex.io"

[observability.logs]
enabled = true

# Durable data. Migrations live in ./migrations; applied locally with
# `pnpm db:migrate:local`, remotely ONLY by deploy.yml on main pushes.
[[d1_databases]]
binding = "DB"
database_name = "tunnex-site-db"
database_id = "9b5d5193-3c86-4892-a207-f8c0ae811458"
migrations_dir = "migrations"

# Rate limiting counters ONLY (never D1 writes for rate limits).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "9b73f242b63a473981d42a105406a3fc"

# Outbound transactional email — Cloudflare Email Service (public beta).
# The binding is the credential: no API key exists anywhere.
# NOTE: no remote=true — remote proxy sessions need Cloudflare auth, which is
# CI-only; local dev falls back to the dev transport / local simulation.
[[send_email]]
name = "EMAIL"
