# Cloudflare Worker config for the tunnex.io marketing site.
# Secrets are NEVER stored here — use `wrangler secret put` (prod) and
# `.dev.vars` (local, gitignored; see .dev.vars.example).

name = "tunnex-site"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
# PR CI uploads an undeployed Worker version and publishes its unique preview
# URL for review. Keep previews explicit: custom routes otherwise make Wrangler
# default them off, leaving a successful upload with no URL for the PR.
preview_urls = true

# Custom Domain routes are attached on Cloudflare Dashboard.
routes = [
  { pattern = "tunnex.io", custom_domain = true },
  { pattern = "www.tunnex.io", custom_domain = true },
  # ⛔ THE INSTALL HOST. src/worker.ts intercepts this hostname BEFORE the Astro adapter and serves the
  # installer for every path — never the site, never the site's 404 page. Adding the route without the
  # handler is what piped the marketing homepage into a customer's shell; the two ship together.
  #
  # ⚠ A ZONE ROUTE, NOT `custom_domain = true`, AND THE DIFFERENCE IS WHO OWNS THE DNS RECORD. A custom
  # domain makes Cloudflare CREATE and own the record, and it REFUSES when a record for that name already
  # exists — which is exactly what happened: the deploy uploaded the Worker and then failed to attach the
  # trigger, leaving the code live and the hostname still served by the site. A zone route binds the Worker
  # to a record that already exists and touches DNS not at all.
  #
  # ⛔ AND THE PATTERN IS `/*`, NOT THE BARE HOST. A bare hostname matches only `/`; every other path would
  # fall through to the site — including the site's 404 page, which is HTML going into a shell.
  { pattern = "get.tunnex.io/*", zone_name = "tunnex.io" }
]
# Custom entry: the adapter's fetch handler + the lifecycle cron's scheduled
# handler (the adapter uses this instead of its default entry).
main = "src/worker.ts"

# Daily lifecycle run (03:17 UTC — off the top-of-hour stampede).
[triggers]
crons = ["17 3 * * *"]

# The build generates the deployable config (dist/client/wrangler.json) plus a
# .wrangler/deploy/config.json redirect — `wrangler dev`/`deploy` after
# `astro build` picks it up automatically. This file is the source config.
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "404-page"
# The assets layer must not swallow navigations to SSR routes: any route with
# prerender=false MUST be listed here, or browsers get the 404 page while curl
# gets the real response (Sec-Fetch-Mode: navigate triggers not_found_handling
# instead of invoking the Worker).
# ⛔ THE WORKER RUNS FIRST FOR EVERY REQUEST, AND THE INSTALL HOST IS WHY.
#
# This was an ALLOW-LIST of SSR paths, and the comment above records the trap it was written for: the
# assets layer serves matching paths DIRECTLY and never invokes the Worker script. `get.tunnex.io` needs
# the opposite of a path list — it needs EVERY path, including ones that do not exist, because a request
# to `get.tunnex.io/anything` that falls through to `not_found_handling = "404-page"` returns the site's
# 404 PAGE as HTML, and that HTML goes into `curl … | sh`.
#
# ⚠ IT IS NOT PATH-SCOPABLE TO A HOSTNAME. run_worker_first takes path globs, not hosts, so covering every
# path on one hostname means covering every path. The cost is one Worker invocation per asset request; the
# Astro adapter serves assets through the ASSETS binding either way, so behaviour is unchanged.
#
# ⭐ THE SYMPTOM THIS FIXES: the deployed Worker contained the correct hostname check, the zone route
# existed and pointed at the right script, DNS resolved — and requests still returned the marketing
# homepage, because the script was never invoked at all. A probe header proved it: no response on either
# hostname carried it.
run_worker_first = true

[vars]
# "prelaunch" | "beta" — see README. Flipping this is the only change
# needed to switch site modes.
LAUNCH_MODE = "beta"
# Turnstile widget sitekey (public). The always-pass TEST key is local-dev
# only (.dev.vars) — never a deployed default.
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADz8NeQ_TUjJuy-O"
# Where enterprise-lead notifications land (Spacemail alias, staffed via support@).
SALES_NOTIFY_EMAIL = "sales@tunnex.io"
EMAIL_LINK_BASE_URL = "https://tunnex.io"
# ⛔ CLOUDFLARE ACCESS IDENTITY (S12.10) — the admin surfaces' only gate, replacing ADMIN_TOKEN.
# Both are IDENTIFIERS, not secrets: the team domain is public and the audience tag names one Access
# application. They live here rather than in secrets so a deploy cannot silently lose them.
# ⚠ WITHOUT BOTH, EVERY ADMIN ROUTE REFUSES (503, naming what to set). That is deliberate: falling back to
# a shared string on a missing variable would make a typo downgrade the gate in front of the signer.
# ⭐ The audience tag comes from the Access application in the Cloudflare dashboard (Application → Overview
# → Application Audience (AUD) Tag).
CF_ACCESS_TEAM_DOMAIN = "muddy-butterfly-9863.cloudflareaccess.com"
CF_ACCESS_AUD = "56c2bbb9590bf69221b61fadb4edd345c35b22f86b68b820c508fca2e776736f"

[observability.logs]
enabled = true

# Durable data. Migrations live in ./migrations; applied locally with
# `pnpm db:migrate:local`, remotely ONLY by deploy.yml on main pushes.
[[d1_databases]]
binding = "DB"
database_name = "tunnex-site-db"
database_id = "9b5d5193-3c86-4892-a207-f8c0ae811458"
migrations_dir = "migrations"

# Rate limiting counters ONLY (never D1 writes for rate limits).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "9b73f242b63a473981d42a105406a3fc"

# Outbound transactional email — Cloudflare Email Service (public beta).
# The binding is the credential: no API key exists anywhere.
# NOTE: no remote=true — remote proxy sessions need Cloudflare auth, which is
# CI-only; local dev falls back to the dev transport / local simulation.
[[send_email]]
name = "EMAIL"
