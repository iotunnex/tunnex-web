# PR pipeline: checks (typecheck + lint + format + build) then a preview
# deploy whose URL is posted as a sticky PR comment.
#
# Node is pinned from the committed .nvmrc in every job — never floating.
# Only first-party actions (actions/*, pnpm/*) — the site repo is its own
# trust domain; keep the supply chain minimal.

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm installer:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
      - name: Accessibility scan (axe)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm axe

  preview:
    # Fork PRs have no access to secrets; preview only for same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: upload-output.json
        run: |
          pnpm exec wrangler versions upload
          version="$(jq -r 'select(.type == "version-upload") | .version_id // empty' upload-output.json | tail -1)"
          url="$(jq -r 'select(.type == "version-upload") | .preview_url // empty' upload-output.json | tail -1)"
          if [ -z "$version" ]; then
            echo "No version ID found in Wrangler's machine-readable output" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post preview URL on PR (sticky comment)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- tunnex-preview-url -->';
            const url = '${{ steps.upload.outputs.url }}';
            const version = '${{ steps.upload.outputs.version }}';
            const preview = url
              ? `**Preview:** ${url}`
              : `**Preview version uploaded:** \`${version}\`\n\n_A shareable URL will appear after preview URLs are activated by the next production deploy._`;
            const body = `${marker}\n${preview}\n\n_Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · updated ${new Date().toISOString()}_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
