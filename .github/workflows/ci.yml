# PR pipeline: checks (typecheck + lint + format + build) then a preview
# deploy whose URL is posted as a sticky PR comment.
#
# Node is pinned from the committed .nvmrc in every job — never floating.
# Only first-party actions (actions/*, pnpm/*) — the site repo is its own
# trust domain; keep the supply chain minimal.

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  preview:
    # Fork PRs have no access to secrets; preview only for same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler versions upload | tee upload.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | tail -1)"
          if [ -z "$url" ]; then
            echo "No preview URL found in wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post preview URL on PR (sticky comment)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- tunnex-preview-url -->';
            const url = '${{ steps.upload.outputs.url }}';
            const body = `${marker}\n**Preview:** ${url}\n\n_Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · updated ${new Date().toISOString()}_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
