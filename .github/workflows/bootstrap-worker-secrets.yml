# TEMPORARY (S2.3): sync Worker secrets from GitHub repo secrets — Cloudflare
# credentials are CI-only, so `wrangler secret put` must run here. Removed
# once both secrets are set. Skips gracefully while a secret is still unset.

name: Bootstrap Worker Secrets

on:
  push:
    branches: [story/S2.3-newsletter]
    paths:
      - .github/workflows/bootstrap-worker-secrets.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Put TURNSTILE_SECRET
        env:
          VALUE: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$VALUE" ]; then echo "TURNSTILE_SECRET not set in repo secrets — skipped"; else
            printf '%s' "$VALUE" | pnpm exec wrangler versions secret put TURNSTILE_SECRET --message 'sync TURNSTILE_SECRET' && echo "TURNSTILE_SECRET synced"; fi

